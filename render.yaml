services:
  - type: web
    name: can-v2x-ids
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: API_TOKEN
        sync: false
      - key: V2X_MACRO_F1_REVIEW_THRESHOLD
        value: "0.70"
